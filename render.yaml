services:
  - type: web
    name: visualli-mindloom
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm rebuild better-sqlite3 && pnpm build
    startCommand: pnpm --filter server start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: GROQ_API_KEY
        sync: false
